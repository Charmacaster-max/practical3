<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team JavaScript Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    .calculator {
      width: 320px;
      background: #1e293b;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
    }

    .calculator-screen {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .expression {
      font-size: 0.9rem;
      color: #94a3b8;
      min-height: 20px;
      word-break: break-all;
    }

    .result {
      font-size: 2rem;
      font-weight: 600;
      color: #f8fafc;
      word-break: break-all;
    }

    .result.error {
      font-size: 1.15rem;
      color: #f87171;
    }

    .calculator-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .key {
      height: 54px;
      border: none;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: 500;
      cursor: pointer;
      background: #334155;
      color: #f8fafc;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .key:hover {
      background: #475569;
    }

    .key:active {
      transform: scale(0.96);
    }

    .key-span-2 {
      grid-column: span 2;
    }

    .key-util {
      background: #475569;
      color: #e2e8f0;
    }

    .key-op {
      background: #0284c7;
    }

    .key-op:hover {
      background: #0369a1;
    }

    .key-eq {
      background: #16a34a;
    }

    .key-eq:hover {
      background: #15803d;
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="calculator" aria-label="JavaScript Calculator">
      <div class="calculator-screen">
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
      </div>

      <div class="calculator-keys">
        <button type="button" class="key key-util key-span-2" data-action="clear">AC</button>
        <button type="button" class="key key-util" data-action="backspace">⌫</button>
        <button type="button" class="key key-op" data-action="operator" data-value="/">÷</button>

        <button type="button" class="key" data-action="digit" data-value="7">7</button>
        <button type="button" class="key" data-action="digit" data-value="8">8</button>
        <button type="button" class="key" data-action="digit" data-value="9">9</button>
        <button type="button" class="key key-op" data-action="operator" data-value="*">×</button>

        <button type="button" class="key" data-action="digit" data-value="4">4</button>
        <button type="button" class="key" data-action="digit" data-value="5">5</button>
        <button type="button" class="key" data-action="digit" data-value="6">6</button>
        <button type="button" class="key key-op" data-action="operator" data-value="-">−</button>

        <button type="button" class="key" data-action="digit" data-value="1">1</button>
        <button type="button" class="key" data-action="digit" data-value="2">2</button>
        <button type="button" class="key" data-action="digit" data-value="3">3</button>
        <button type="button" class="key key-op" data-action="operator" data-value="+">+</button>

        <button type="button" class="key key-span-2" data-action="digit" data-value="0">0</button>
        <button type="button" class="key" data-action="decimal">.</button>
        <button type="button" class="key key-eq" data-action="equals">=</button>
      </div>
    </section>
  </main>

  <!-- Load each team member's module in order -->
  <script src="operations.js"></script>
  <script src="display.js"></script>
  <script src="app.js"></script>
</body>
</html>
